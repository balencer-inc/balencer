<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2ef" />
    <title>BALENCER — Brand Profile</title>
    <meta
      name="description"
      content="経営と並走する、ブランディングカンパニー。株式会社バレンサーのブランドプロフィール。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="reader">
      <h1 class="sr-only">BALENCER Brand Profile</h1>
      <div class="book" aria-live="polite"></div>
      <button class="tap-zone tap-zone--prev" aria-label="前のページ"></button>
      <button class="tap-zone tap-zone--next" aria-label="次のページ"></button>

      <header class="topbar is-visible">
        <button class="wordmark home-button" aria-label="表紙（トップ）に戻る" title="表紙に戻る">BALENCER</button>
        <span class="descriptor">BRAND PROFILE</span>
      </header>

      <nav class="controls is-visible" aria-label="ページ操作">
        <button class="control-button index-button" aria-label="ページ一覧">
          <span class="grid-icon" aria-hidden="true"></span><span>INDEX</span>
        </button>
        <div class="pagination">
          <button class="prev-button" aria-label="前のページ">←</button>
          <span><b>01</b><i></i><em>14</em></span>
          <button class="next-button" aria-label="次のページ">→</button>
        </div>
        <button class="control-button full-button" aria-label="全画面表示">
          <span class="fullscreen-icon" aria-hidden="true"></span><span>FULL</span>
        </button>
      </nav>
      <div class="progress" aria-hidden="true"><span></span></div>

      <section class="overview" aria-label="ページ一覧" hidden>
        <header>
          <div><span class="wordmark">BALENCER</span><p>BRAND PROFILE / ALL PAGES</p></div>
          <button class="close-button" aria-label="一覧を閉じる">CLOSE <span>×</span></button>
        </header>
        <div class="overview-grid"></div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
